
name: EV Auto Saathi APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project and build APK
        shell: bash
        run: |
          set -e

          test -f EV_Auto_Saathi_2_0_Source.zip
          test -f google-services.json

          mkdir extracted
          unzip -q EV_Auto_Saathi_2_0_Source.zip -d extracted

          ANDROID_DIR=$(find extracted -type f \
            -name settings.gradle.kts -printf '%h\n' | head -n 1)

          test -n "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR/app"
          cp google-services.json "$ANDROID_DIR/app/"

          gradle -p "$ANDROID_DIR" assembleDebug

          APK=$(find "$ANDROID_DIR" -type f \
            -name app-debug.apk | head -n 1)

          test -f "$APK"
          mkdir -p output
          cp "$APK" output/EV-Auto-Saathi.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Auto-Saathi-APK
          path: output/EV-Auto-Saathi.apk
          if-no-files-found: error
          
